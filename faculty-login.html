<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Faculty Login | CK College of Engineering and Technology</title>
  <meta name="description" content="Faculty login for CK College of Engineering and Technology (CKCET) Result Management System." />
  <link rel="stylesheet" href="./style.css" />
</head>
<body class="auth-body">
  <!-- Minimal Top Header -->
  <header class="landing-header">
    <div class="landing-nav-content">
      <a href="./index.html" class="brand-logo-lockup" id="brandLogo">
        <div class="logo-badge">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
            <path d="M6 12v5c3 3 9 3 12 0v-5"/>
          </svg>
        </div>
        <div class="logo-text-wrap">
          <h1>CKCET</h1>
          <p>CK College of Engineering and Technology</p>
        </div>
      </a>

      <div class="header-actions">
        <a href="./index.html" class="btn btn-secondary btn-sm" id="btnBackHome">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>
          </svg>
          Back to Home
        </a>
        <button class="theme-toggle-btn" aria-label="Toggle theme">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Centered Login Card -->
  <main class="auth-wrapper">
    <div class="auth-card" id="facultyLoginCard">
      <div class="auth-card-header">
        <div class="auth-avatar-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M22 21v-2a4 4 0 0 0-3-3.87"/>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
        </div>
        <h2>Faculty Login</h2>
        <p>Access the Result Management Dashboard</p>
      </div>

      <!-- Error Alert Box -->
      <div id="loginErrorAlert" style="display: none; background: var(--danger-50); border: 1px solid rgba(239, 68, 68, 0.3); border-radius: var(--radius-md); padding: 0.75rem 1rem; margin-bottom: 1.25rem; color: var(--danger-700); font-size: 0.85rem; font-weight: 500;">
        <div style="display: flex; align-items: center; gap: 0.5rem;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
          <span id="errorMessageText">Invalid credentials</span>
        </div>
      </div>

      <form id="facultyLoginForm" autocomplete="on">
        <!-- Faculty Login ID -->
        <div class="form-group">
          <label class="form-label" for="facultyLoginId">Faculty Login ID</label>
          <div class="input-with-icon">
            <span class="input-icon-prefix">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
              </svg>
            </span>
            <input 
              type="text" 
              id="facultyLoginId" 
              name="facultyLoginId" 
              class="form-input" 
              placeholder="e.g. result.com" 
              required 
            />
          </div>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label class="form-label" for="facultyPassword">Password</label>
          <div class="input-with-icon">
            <span class="input-icon-prefix">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </span>
            <input 
              type="password" 
              id="facultyPassword" 
              name="facultyPassword" 
              class="form-input" 
              placeholder="Enter password" 
              required 
            />
            <button type="button" class="password-toggle-btn" id="btnTogglePassword" aria-label="Toggle password visibility">
              <!-- Eye Icon -->
              <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Remember Login & Forgot -->
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem;">
          <label class="form-checkbox-label">
            <input type="checkbox" id="rememberLoginCheckbox" checked />
            <span>Remember login</span>
          </label>
          <a href="#" id="forgotHelpLink" style="font-size: 0.825rem;">Need help?</a>
        </div>

        <!-- Submit Button with Loading State -->
        <button type="submit" class="btn btn-primary btn-block" id="btnSubmitLogin">
          <span id="loginBtnText">Login to Dashboard</span>
          <span id="loginBtnSpinner" style="display: none;" class="spinner"></span>
        </button>
      </form>

      <div style="margin-top: 1.75rem; text-align: center; font-size: 0.85rem; color: var(--text-muted);">
        Looking for Student Results? <a href="./student-login.html" style="font-weight: 600;">Student Login</a>
      </div>
    </div>
  </main>

  <footer class="portal-footer">
    <div class="footer-inner" style="justify-content: center;">
      <div>CK College of Engineering and Technology (CKCET) &bull; Faculty Administration Access</div>
    </div>
  </footer>

  <script src="./data.js"></script>
  <script src="./script.js"></script>
  <script>
    /**
     * Faculty Login Controller
     * 
     * Production deployment must use a secure backend,
     * database, hashed passwords, authentication and
     * role-based authorization.
     */
    document.addEventListener('DOMContentLoaded', () => {
      const loginForm = document.getElementById('facultyLoginForm');
      const loginIdInput = document.getElementById('facultyLoginId');
      const passwordInput = document.getElementById('facultyPassword');
      const togglePasswordBtn = document.getElementById('btnTogglePassword');
      const rememberCheckbox = document.getElementById('rememberLoginCheckbox');
      const submitBtn = document.getElementById('btnSubmitLogin');
      const btnText = document.getElementById('loginBtnText');
      const btnSpinner = document.getElementById('loginBtnSpinner');
      const errorAlert = document.getElementById('loginErrorAlert');
      const errorMsgText = document.getElementById('errorMessageText');

      // Check saved remembered login
      const savedLogin = localStorage.getItem('ckcet_remembered_faculty');
      if (savedLogin) {
        loginIdInput.value = savedLogin;
      }

      // Show / Hide Password Toggle
      togglePasswordBtn.addEventListener('click', () => {
        const isPassword = passwordInput.type === 'password';
        passwordInput.type = isPassword ? 'text' : 'password';
        togglePasswordBtn.innerHTML = isPassword
          ? `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m2 2 20 20"/><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/></svg>`
          : `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>`;
      });

      // Forgot help link
      document.getElementById('forgotHelpLink').addEventListener('click', (e) => {
        e.preventDefault();
        showToast('Please contact the examination cell or institutional administrator.', 'info');
      });

      // Form Submit
      loginForm.addEventListener('submit', (e) => {
        e.preventDefault();
        errorAlert.style.display = 'none';

        const id = loginIdInput.value.trim();
        const pwd = passwordInput.value.trim();

        if (!id || !pwd) {
          errorMsgText.textContent = 'Please provide both Login ID and Password';
          errorAlert.style.display = 'block';
          showToast('Please fill all required fields', 'error');
          return;
        }

        // Show loading state
        submitBtn.disabled = true;
        btnText.style.display = 'none';
        btnSpinner.style.display = 'inline-block';

        setTimeout(() => {
          // Credentials verification
          if (id === 'result.com' && pwd === 'ckcet') {
            if (rememberCheckbox.checked) {
              localStorage.setItem('ckcet_remembered_faculty', id);
            } else {
              localStorage.removeItem('ckcet_remembered_faculty');
            }

            localStorage.setItem(STORAGE_KEYS.FACULTY_AUTH, JSON.stringify({
              loginId: id,
              name: 'Prof. S. Ranganathan',
              department: 'Department of Examinations',
              loggedAt: new Date().toISOString()
            }));

            showToast('✓ Login successful! Redirecting to Dashboard...', 'success');

            setTimeout(() => {
              window.location.href = './faculty-dashboard.html';
            }, 800);
          } else {
            submitBtn.disabled = false;
            btnText.style.display = 'inline';
            btnSpinner.style.display = 'none';

            errorMsgText.textContent = '✕ Invalid Login ID or Password.';
            errorAlert.style.display = 'block';
            showToast('✕ Login failed: Invalid credentials', 'error');
          }
        }, 700);
      });
    });
  </script>
</body>
</html>
